
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found — STACKLY</title>

    <link rel="stylesheet" href="./css/404.css">
    <script src="./js/404.js" defer></script>
</head>

<body>

    <main class="error-page">

        <div class="error-background"></div>
        <div class="error-overlay"></div>
        <div class="error-grid"></div>

        <div class="error-orbit error-orbit-one"></div>
        <div class="error-orbit error-orbit-two"></div>

        <div class="error-content">


<a href="index.html" class="error-logo" aria-label="Go to Home">
    <img src="image/stackly_logo.webp"
         alt="STACKLY Logo">
</a>


            <div class="error-label error-reveal">
                <span class="error-label-line"></span>
                ERROR / 404
                <span class="error-label-line"></span>
            </div>

            <div class="error-number error-reveal">
                4<span>0</span>4
            </div>

            <h1 class="error-title error-reveal">
                Lost in the
                <span>unknown.</span>
            </h1>

            <p class="error-description error-reveal">
                The page you're looking for may have moved,
                disappeared or never existed. Let's get you
                back on the right path.
            </p>

            <div class="error-actions error-reveal">

                <button
                    type="button"
                    class="error-btn error-btn-primary"
                    id="goBackBtn"
                >
                    <span class="error-btn-arrow">←</span>
                    GO BACK
                </button>

                <a href="index.html" class="error-btn error-btn-secondary">
                    GO HOME
                    <span class="error-home-arrow">↗</span>
                </a>

            </div>

            <div class="error-footer error-reveal">
                <span class="error-footer-dot"></span>
                <span>STACKLY</span>
                <span class="error-footer-divider"></span>
                <span>FIND YOUR WAY FORWARD.</span>
            </div>

        </div>

        <div class="error-corner error-corner-top">
            40° / 04°
        </div>

        <div class="error-corner error-corner-bottom">
            PAGE NOT FOUND
        </div>

    </main>

</body>
</html>
